# Keep the Template's dependencies current: a weekly pull request per ecosystem,
# minor and patch updates grouped into one, which CI checks before anyone merges.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # astro check refuses TypeScript 7 ("install TypeScript 6 instead"); stay
      # on 6 until it supports it, then drop this.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
